# Render Blueprint for Faroz (defense demo): PostgreSQL + API (NestJS) + website (Next.js).
# Guide: docs/engineering/DEPLOYMENT.md. Create it in Render: New → Blueprint → this repository.
#
# The service names below become the public addresses https://<name>.onrender.com. If Render
# gives a service another address (the name was taken), update WEB_ORIGIN on faroz-api and
# NEXT_PUBLIC_API_URL on faroz-web to the real addresses, then redeploy both.
#
# Free plan limits: services sleep after ~15 minutes without traffic (the first request then takes
# about a minute), and a free database is deleted 30 days after it was created.

databases:
  - name: faroz-db
    plan: free
    region: frankfurt
    databaseName: faroz
    user: faroz

services:
  - type: web
    name: faroz-api
    runtime: node
    plan: free
    region: frankfurt
    branch: feat/faroz-platform
    buildCommand: corepack enable && NODE_ENV=development pnpm install --frozen-lockfile && pnpm prep && pnpm --filter @nuvora/api build
    # Migrations, learning content, demo data on the first start (SEED_ON_START), then the API.
    startCommand: cd apps/api && node scripts/render-start.mjs
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Asia/Dushanbe
      - key: DATABASE_URL
        fromDatabase:
          name: faroz-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        value: https://faroz-web.onrender.com
      # Render's proxy sits in front of the API: client addresses come from X-Forwarded-For.
      - key: TRUST_PROXY
        value: 'on'
      # Demo sign-in without passwords, for the defense. Switch "off" for real users.
      - key: DEMO_LOGINS
        value: 'on'
      - key: SEED_ON_START
        value: demo
      # Push: "log" sends nothing; "expo" needs EAS/Firebase credentials (see the mobile story).
      - key: PUSH_DELIVERY
        value: log
      - key: PUSH_SCHEDULER
        value: 'off'

  - type: web
    name: faroz-web
    runtime: node
    plan: free
    region: frankfurt
    branch: feat/faroz-platform
    buildCommand: corepack enable && NODE_ENV=development pnpm install --frozen-lockfile && pnpm --filter @nuvora/shared build && pnpm --filter @nuvora/web build
    startCommand: pnpm --filter @nuvora/web start
    healthCheckPath: /ru
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Asia/Dushanbe
      # Public API address: the site's /api/v1 rewrite, server-side pages and Socket.IO use it.
      # Read at build time (NEXT_PUBLIC_*): redeploy the site after changing it.
      - key: NEXT_PUBLIC_API_URL
        value: https://faroz-api.onrender.com/api/v1
